<!DOCTYPE html>
<html class="h-full bg-gray-100" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title
      th:text="${customer.id == null ? 'Ajout d un client':'Modifier '+customer.firstName+' '+customer.lastName}"
    ></title>
  </head>
  <body class="h-full">
    <div class="min-h-full">
      <div th:replace="~{fragments/navbar :: navbar}"></div>
      <main>
        <header class="bg-white shadow">
          <div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
            <h1
              th:text="${customer.id == null ? 'Ajout d un client':'Modifier '+customer.firstName+' '+customer.lastName}"
              class="text-3xl font-bold tracking-tight text-gray-900"
            ></h1>
          </div>
        </header>
        <div class="mx-auto max-w-5xl px-4 py-6 sm:px-6 lg:px-8">
          <div class="bg-blue-100 rounded-lg min-h-screen flex items-center">
            <div class="w-full">
              <h2
                th:text="${customer.id == null ? 'Ajout d un client':'Modifier '+customer.firstName+' '+customer.lastName}"
                class="text-center text-blue-400 font-bold text-2xl mb-10"
              ></h2>
              <div
                class="bg-white shadow-lg p-10 rounded-lg shadow md:w-3/4 mx-auto lg:w-1/2"
              >
                <form
                  th:action="@{'/save'}"
                  th:method="POST"
                  th:object="${customer}"
                >
                  <input type="hidden" th:field="${customer.id}" />
                  <div class="mb-5">
                    <label
                      for="firstName"
                      class="block mb-2 font-bold text-gray-600"
                      >Prénom</label
                    >
                    <input
                      type="text"
                      th:field="${customer.firstName}"
                      placeholder="Saisir votre prénom"
                      class="border border-gray-300 shadow p-3 w-full rounded"
                    />
                    <p
                      th:if="${#fields.hasErrors('firstName')}"
                      th:errors="*{firstName}"
                      class="text-sm font-bold text-red-400 mt-2"
                    ></p>
                  </div>
                  <div class="mb-5">
                    <label
                      for="lastName"
                      class="block mb-2 font-bold text-gray-600"
                      >Nom</label
                    >
                    <input
                      type="text"
                      th:field="${customer.lastName}"
                      placeholder="Saisir votre nom"
                      class="border border-gray-300 shadow p-3 w-full rounded"
                    />
                    <p
                      th:if="${#fields.hasErrors('lastName')}"
                      th:errors="*{lastName}"
                      class="text-sm font-bold text-red-400 mt-2"
                    ></p>
                  </div>
                  <div class="mb-5">
                    <label
                      for="email"
                      class="block mb-2 font-bold text-gray-600"
                      >Email</label
                    >
                    <input
                      type="email"
                      th:field="${customer.email}"
                      placeholder="Saisir votre email"
                      class="border border-gray-300 shadow p-3 w-full rounded"
                    />
                    <p
                      th:if="${#fields.hasErrors('email')}"
                      th:errors="*{email}"
                      class="text-sm font-bold text-red-400 mt-2"
                    ></p>
                  </div>
                  <div class="mb-5">
                    <label
                      for="phone"
                      class="block mb-2 font-bold text-gray-600"
                      >Numéro de téléphone</label
                    >
                    <input
                      type="number"
                      th:field="${customer.phone}"
                      placeholder="Saisir votre téléphone"
                      class="border border-gray-300 shadow p-3 w-full rounded"
                    />
                    <p
                      th:if="${#fields.hasErrors('phone')}"
                      th:errors="*{phone}"
                      class="text-sm font-bold text-red-400 mt-2"
                    ></p>
                  </div>

                  <button
                    type="submit"
                    class="block w-full bg-blue-500 text-white font-bold p-4 rounded-lg"
                  >
                    Ajouter
                  </button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </main>
      <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
  </body>
</html>
