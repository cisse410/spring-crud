<!DOCTYPE html>
<html class="h-full bg-gray-100" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Accueil</title>
  </head>
  <body class="h-full">
    <div class="min-h-full">
      <nav class="bg-gray-800">
        <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
          <div class="flex h-16 items-center justify-between">
            <div class="flex items-center">
              <div class="shrink-0">
                <img
                  class="size-8"
                  src="https://tailwindui.com/plus/img/logos/mark.svg?color=indigo&shade=500"
                  alt="Your Company"
                />
              </div>
              <div class="hidden md:block">
                <div class="ml-10 flex items-baseline space-x-4">
                  <!-- Current: "bg-gray-900 text-white", Default: "text-gray-300 hover:bg-gray-700 hover:text-white" -->
                  <a
                    th:href="@{/}"
                    class="rounded-md bg-gray-900 px-3 py-2 text-sm font-medium text-white"
                    aria-current="page"
                    >Accueil</a
                  >
                  <a
                    href="#"
                    class="rounded-md px-3 py-2 text-sm font-medium text-gray-300 hover:bg-gray-700 hover:text-white"
                    >Team</a
                  >
                  <a
                    href="#"
                    class="rounded-md px-3 py-2 text-sm font-medium text-gray-300 hover:bg-gray-700 hover:text-white"
                    >Projects</a
                  >
                  <a
                    href="#"
                    class="rounded-md px-3 py-2 text-sm font-medium text-gray-300 hover:bg-gray-700 hover:text-white"
                    >Calendar</a
                  >
                  <a
                    href="#"
                    class="rounded-md px-3 py-2 text-sm font-medium text-gray-300 hover:bg-gray-700 hover:text-white"
                    >Reports</a
                  >
                </div>
              </div>
            </div>
          </div>
        </div>
      </nav>
      <main>
        <header class="bg-white shadow">
          <div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
            <h1 class="text-3xl font-bold tracking-tight text-gray-900">
              Ajout d'un client
            </h1>
          </div>
        </header>
        <div class="mx-auto max-w-5xl px-4 py-6 sm:px-6 lg:px-8">
          <div class="bg-blue-100 rounded-lg min-h-screen flex items-center">
            <div class="w-full">
              <h2 class="text-center text-blue-400 font-bold text-2xl mb-10">
                Ajout d'un client
              </h2>
              <div
                class="bg-white shadow-lg p-10 rounded-lg shadow md:w-3/4 mx-auto lg:w-1/2"
              >
                <form
                  th:action="@{'/save'}"
                  th:method="POST"
                  th:object="${customer}"
                >
                  <div class="mb-5">
                    <label
                      for="firstName"
                      class="block mb-2 font-bold text-gray-600"
                      >Prénom</label
                    >
                    <input
                      type="text"
                      th:field="${customer.firstName}"
                      placeholder="Saisir votre prénom"
                      class="border border-gray-300 shadow p-3 w-full rounded"
                    />
                  </div>
                  <div class="mb-5">
                    <label
                      for="lastName"
                      class="block mb-2 font-bold text-gray-600"
                      >Nom</label
                    >
                    <input
                      type="text"
                      th:field="${customer.lastName}"
                      placeholder="Saisir votre nom"
                      class="border border-gray-300 shadow p-3 w-full rounded mb-"
                    />
                  </div>
                  <div class="mb-5">
                    <label
                      for="email"
                      class="block mb-2 font-bold text-gray-600"
                      >Email</label
                    >
                    <input
                      type="email"
                      th:field="${customer.email}"
                      placeholder="Saisir votre email"
                      class="border border-gray-300 shadow p-3 w-full rounded mb-"
                    />
                  </div>
                  <div class="mb-5">
                    <label
                      for="phone"
                      class="block mb-2 font-bold text-gray-600"
                      >Numéro de téléphone</label
                    >
                    <input
                      type="number"
                      th:field="${customer.phone}"
                      placeholder="Saisir votre téléphone"
                      class="border border-gray-300 shadow p-3 w-full rounded mb-"
                    />
                  </div>

                  <button
                    type="submit"
                    class="block w-full bg-blue-500 text-white font-bold p-4 rounded-lg"
                  >
                    Ajouter
                  </button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
