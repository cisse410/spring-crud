<!DOCTYPE html>
<html class="h-full bg-gray-100" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Accueil</title>
  </head>
  <body class="h-full">
    <div class="min-h-full">
      <nav class="bg-gray-800">
        <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
          <div class="flex h-16 items-center justify-between">
            <div class="flex items-center">
              <div class="shrink-0">
                <img
                  class="size-8"
                  src="https://tailwindui.com/plus/img/logos/mark.svg?color=indigo&shade=500"
                  alt="Your Company"
                />
              </div>
              <div class="hidden md:block">
                <div class="ml-10 flex items-baseline space-x-4">
                  <!-- Current: "bg-gray-900 text-white", Default: "text-gray-300 hover:bg-gray-700 hover:text-white" -->
                  <a
                    th:href="@{/}"
                    class="rounded-md bg-gray-900 px-3 py-2 text-sm font-medium text-white"
                    aria-current="page"
                    >Accueil</a
                  >
                  <a
                    href="#"
                    class="rounded-md px-3 py-2 text-sm font-medium text-gray-300 hover:bg-gray-700 hover:text-white"
                    >Team</a
                  >
                  <a
                    href="#"
                    class="rounded-md px-3 py-2 text-sm font-medium text-gray-300 hover:bg-gray-700 hover:text-white"
                    >Projects</a
                  >
                  <a
                    href="#"
                    class="rounded-md px-3 py-2 text-sm font-medium text-gray-300 hover:bg-gray-700 hover:text-white"
                    >Calendar</a
                  >
                  <a
                    href="#"
                    class="rounded-md px-3 py-2 text-sm font-medium text-gray-300 hover:bg-gray-700 hover:text-white"
                    >Reports</a
                  >
                </div>
              </div>
            </div>
          </div>
        </div>
      </nav>
      <main>
        <header class="bg-white shadow">
          <div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
            <h1 class="text-3xl font-bold tracking-tight text-gray-900">
              Dashboard
            </h1>
          </div>
        </header>
        <div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
          <a
            th:href="@{'/create'}"
            class="bg-blue-600 font-medium px-3 py-2 mb-3 rounded-md text-sm text-white inline-block hover:bg-blue-800"
            >Ajouter un client</a
          >
          <table class="table-auto w-full">
            <thead class="bg-gray-800 text-white uppercase">
              <tr>
                <th class="px-6 py-3 text-center">Id</th>
                <th class="px-6 py-3 text-center">Prenom</th>
                <th class="px-6 py-3 text-center">Nom</th>
                <th class="px-6 py-3 text-center">Email</th>
                <th class="px-6 py-3 text-center">Téléphone</th>
              </tr>
            </thead>
            <tbody>
              <tr class="bg-white border-b" th:each="customer : ${customers}">
                <td class="px-6 py-5 text-center" th:text="${customer.id}"></td>
                <td
                  class="px-6 py-5 text-center"
                  th:text="${customer.firstName}"
                ></td>
                <td
                  class="px-6 py-5 text-center"
                  th:text="${customer.lastName}"
                ></td>
                <td
                  class="px-6 py-5 text-center"
                  th:text="${customer.email}"
                ></td>
                <td
                  class="px-6 py-5 text-center"
                  th:text="${customer.phone}"
                ></td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </body>
</html>
