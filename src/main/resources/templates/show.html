<!DOCTYPE html>
<html class="h-full bg-gray-100" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Afficher un client</title>
  </head>
  <body class="h-full">
    <div class="min-h-full">
      <div th:replace="~{fragments/navbar :: navbar}"></div>

      <main>
        <header class="bg-white shadow">
          <div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
            <h1
              class="text-3xl font-bold tracking-tight text-gray-900"
              th:text="'Détails sur: ' + ${customer.firstName} + ' ' + ${customer.lastName}"
            ></h1>
          </div>
        </header>
        <div class="mx-auto max-w-5xl px-4 py-6 sm:px-6 lg:px-8">
          <div class="bg-blue-100 rounded-lg min-h-screen flex items-center">
            <div class="w-full">
              <div
                class="flex flex-col justify-center items-center bg-gray-100 min-h-screen"
              >
                <div
                  class="bg-white rounded-lg shadow-lg overflow-hidden max-w-lg w-full"
                >
                  <img
                    src="https://images.unsplash.com/photo-1454496522488-7a8e488e8606"
                    alt="Mountain"
                    class="w-full h-64 object-cover"
                  />
                  <div class="p-6">
                    <p class="text-2xl font-bold text-gray-800 mb-2">
                      Email: &nbsp;
                      <span
                        th:text="${customer.email}"
                        class="text-gray-400 mb-4"
                      ></span>
                    </p>
                    <p class="text-2xl font-bold text-gray-800 mb-2">
                      Téléphone: &nbsp;
                      <span
                        th:text="${customer.phone}"
                        class="text-gray-400 leading-tight mb-4"
                      ></span>
                    </p>
                    <div class="flex justify-between items-center">
                      <div class="flex items-center">
                        <img
                          src="https://randomuser.me/api/portraits/men/32.jpg"
                          alt="Avatar"
                          class="w-8 h-8 rounded-full mr-2 object-cover"
                        />
                        <span
                          th:text="${customer.firstName} + ' ' + ${customer.lastName}"
                          class="text-gray-800 font-semibold"
                        ></span>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
      <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
  </body>
</html>
